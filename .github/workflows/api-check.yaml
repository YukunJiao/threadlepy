# Checks threadlepy's wrapper functions against the Threadle backend API snapshot
# in tools/threadle-api.json. See tools/README.md.
on:
  push:
    branches: [main, master]
  pull_request:

name: api-check

permissions: read-all

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check wrappers against the backend API
        run: python tools/check_api.py --report api-coverage.md

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api-coverage.md
