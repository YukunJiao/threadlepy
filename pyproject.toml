[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlepy"
version = "0.1.0"
authors = [
  { name = "Yukun Jiao", email = "jiaoyukun1999@gmail.com" },
]
description = "A Python client for the Threadle CLI"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["threadle", "network", "graph", "cli", "social-networks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/YukunJiao/threadlepy"
Issues = "https://github.com/YukunJiao/threadlepy/issues"
Documentation = "https://github.com/YukunJiao/threadlepy#readme"
Source = "https://github.com/YukunJiao/threadlepy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threadlepy = ["Examples/*.tsv", "Examples/Scripts/*.txt"]
